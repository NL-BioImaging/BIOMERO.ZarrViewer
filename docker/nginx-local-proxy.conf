events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;

    upstream omero_web {
        server omeroweb:4080;
        keepalive 16;
    }

    server {
        listen 4080;
        server_name _;

        # OMERO.web can receive large uploads and long-running requests.
        client_max_body_size 0;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Django authorizes each request and returns this internal target in
        # X-Accel-Redirect. The browser cannot access this location directly.
        location /_biomero_zarr_internal/ {
            internal;
            alias /data/;
            sendfile on;
            tcp_nopush on;
            etag on;
            autoindex off;
            disable_symlinks on;

            types {
                application/json json zattrs zarray zgroup zmetadata;
                application/octet-stream bin;
            }
            default_type application/octet-stream;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "private, max-age=300" always;
        }

        location / {
            proxy_pass http://omero_web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_request_buffering off;
        }
    }
}
