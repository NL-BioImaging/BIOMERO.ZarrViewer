# Include this inside the same Nginx server block that proxies OMERO.web.
# The alias must match omero.web.zarr_viewer.mount_root and the volume must be
# mounted read-only into Nginx.
location /_biomero_zarr_internal/ {
    internal;
    alias /data/;
    sendfile on;
    tcp_nopush on;
    etag on;
    autoindex off;
    disable_symlinks on;

    types {
        application/json json zattrs zarray zgroup zmetadata;
        application/octet-stream bin;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, max-age=300" always;
}

