[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomero-zarr-viewer"
version = "0.1.7"
description = "Authenticated OME-Zarr viewer for BIOMERO and OMERO.web"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NL-BioImaging" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["omero-web>=5.6.0"]

[project.optional-dependencies]
test = [
  "Django>=3.2,<6",
  "pytest>=8",
  "pytest-django>=4.8",
  "build>=1.2",
]

[project.urls]
Repository = "https://github.com/NL-BioImaging/OMERO.ZarrViewer"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biomero_zarr_viewer = [
  "templates/**/*.html",
  "static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
