[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomero-zarr-viewer"
version = "0.6.1"
description = "Authenticated OME-Zarr viewer for BIOMERO and OMERO.web"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = [
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "docs/open-source-provenance.md",
]
authors = [{ name = "NL-BioImaging" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "omero-web>=5.6.0",
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "zarr>=2.18,<4",
]

[project.optional-dependencies]
test = [
  "Django>=3.2,<6",
  "pytest>=8",
  "pytest-django>=4.8",
  "build>=1.2",
]

[project.urls]
Repository = "https://github.com/NL-BioImaging/BIOMERO.ZarrViewer"
Documentation = "https://nl-bioimaging.github.io/BIOMERO.ZarrViewer/"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biomero_zarr_viewer = [
  "templates/**/*.html",
  "static/**/*",
  "analysis_skills/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
