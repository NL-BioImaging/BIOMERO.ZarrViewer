name: Validate ZarrViewer

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -e .
      - name: Install runtime and test dependencies
        run: >-
          python -m pip install
          "Django>=3.2,<6"
          "numpy>=1.24,<3"
          "Pillow>=10,<13"
          "zarr>=2.18,<4"
          "scikit-image>=0.25,<1"
          pytest
          pytest-django
          build
          setuptools
          setuptools-scm
          wheel
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewer-browser-assets
          path: src/biomero_zarr_viewer/static/biomero_zarr_viewer/
  chrome-movie:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - name: Clear checked-in bundles before restoring the tested build
        run: node frontend/scripts/clean-output.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viewer-browser-assets
          path: src/biomero_zarr_viewer/static/biomero_zarr_viewer/
      - run: node node_modules/playwright-core/cli.js install --with-deps chrome
        working-directory: frontend
      - run: npm run smoke:movie
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: chrome-movie-evidence
          path: frontend/test-results/
          if-no-files-found: warn
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict
  distributions:
    needs: [python, frontend, chrome-movie, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Clear checked-in bundles before packaging the tested build
        run: node frontend/scripts/clean-output.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viewer-browser-assets
          path: src/biomero_zarr_viewer/static/biomero_zarr_viewer/
      - run: python -m pip install build setuptools-scm wheel
      - run: python scripts/build_frontend.py --validate-only
      - run: python -m build --wheel --no-isolation
      - run: python scripts/verify_wheel.py --install dist/biomero_zarr_viewer-*.whl
      - name: Build standalone Docker images with and without the optional provider
        shell: bash
        run: |
          wheel=$(basename "$(find dist -maxdepth 1 -name 'biomero_zarr_viewer-*.whl' -print -quit)")
          for enabled in false true; do
            docker build --file docker/Dockerfile.standalone \
              --build-context viewer-wheel=./dist \
              --build-arg "VIEWER_WHEEL=$wheel" \
              --build-arg "ENABLE_HTTP_ZARR=$enabled" \
              --tag "zarrviewer-standalone-check:$enabled" docker
          done
      - name: Verify optional-provider installation in the built images
        shell: bash
        run: |
          for enabled in false true; do
            docker run --rm --entrypoint /opt/omero/web/venv3/bin/python \
              "zarrviewer-standalone-check:$enabled" -c \
              'import importlib.util, pathlib, sys; expected = sys.argv[1] == "true"; assert (importlib.util.find_spec("omero_web_zarr") is not None) == expected; assert pathlib.Path("/opt/omero/web/config/91-omero-web-zarr.omero").exists() == expected; import biomero_zarr_viewer' \
              "$enabled"
          done
