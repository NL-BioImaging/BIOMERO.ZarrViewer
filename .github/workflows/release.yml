name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
  build:
    needs: validation
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install \
            "Django>=3.2,<6" \
            "numpy>=1.24,<3" \
            "Pillow>=10,<13" \
            "zarr>=2.18,<4" \
            pytest \
            pytest-django \
            build \
            setuptools \
            setuptools-scm \
            wheel \
            twine

      - name: Require the release tag to match the derived package version
        shell: bash
        run: |
          package_version="$(python -c 'from setuptools_scm import get_version; print(get_version())')"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match derived package version ${package_version}" >&2
            exit 1
          fi

      - name: Install and test frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Build frontend
        run: python scripts/build_frontend.py --skip-install

      - name: Run Python tests
        run: python -m pytest

      - name: Build distributions
        run: python -m build

      - name: Verify distributions
        run: |
          python scripts/verify_wheel.py dist/biomero_zarr_viewer-*.whl
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/biomero-zarr-viewer
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
