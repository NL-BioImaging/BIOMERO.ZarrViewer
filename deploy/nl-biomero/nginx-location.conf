# Insert inside the HTTPS OMERO.web server block in nginx/nginx.conf.
# NL-BIOMERO mounts its in-place storage at /data by default.
location /_biomero_zarr_internal/ {
    internal;
    alias /data/;
    sendfile on;
    tcp_nopush on;
    etag on;
    autoindex off;
    disable_symlinks on;

    types {
        application/json json zattrs zarray zgroup zmetadata;
        application/octet-stream bin;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, max-age=300" always;
}
